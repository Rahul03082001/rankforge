name: full-corpus-evaluation
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build tools
      - run: docker compose run --rm tools sh scripts/pipeline.sh fiqa
      - uses: actions/upload-artifact@v4
        with:
          name: fiqa-reports
          path: reports/
