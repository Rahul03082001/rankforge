name: correctness
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build tools
      - run: docker compose run --rm tools pytest -q -m "not integration"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build tools
      - run: docker compose run --rm tools sh scripts/pipeline.sh fixture
      - run: docker compose run --rm -e TEST_BUNDLE=artifacts/fixture-ltr tools pytest -q -m integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: docker compose run -d --name rankforge-ci -p 7860:7860 -e RANKFORGE_BUNDLE=artifacts/fixture-ltr tools uvicorn rankforge.api:app --host 0.0.0.0 --port 7860
      - run: for i in $(seq 1 60); do curl -fsS localhost:7860/health/ready && exit 0; sleep 2; done; exit 1
      - run: cd frontend && npx playwright install --with-deps chromium && npm test
